<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Register</title>
    <style>
        form {
            max-width: 320px;
            margin: 40px auto;
        }
        h1 {
            text-align: center;
        }
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }
        small {
            display: block;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 8px;
        }
        #result {
            margin-top: 16px;
        }
        #result.error {
            color: #b00020;
        }
        #result.success {
            color: #1b5e20;
        }
    </style>
</head>
<body>
<form id="registerForm" novalidate>
    <h1>Register</h1>

    <div class="field">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username"
               required minlength="3" maxlength="20"
               pattern="[A-Za-z0-9]{3,20}"
               title="3-20 characters, letters and digits only."
               autocomplete="username">
        <small>3-20 characters, letters and digits only.</small>
    </div>

    <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email"
               required maxlength="254"
               autocomplete="email">
    </div>

    <div class="field">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password"
               required minlength="8" maxlength="30"
               autocomplete="new-password">
        <small>8-30 characters, at least one uppercase letter, one lowercase letter and one digit.
            Must not contain your username or e-mail.</small>
    </div>

    <div class="field">
        <label for="confirmPassword">Repeat password *</label>
        <input type="password" id="confirmPassword"
               required minlength="8" maxlength="30"
               autocomplete="new-password">
    </div>

    <button type="submit">Register</button>
    <div id="result" role="status" aria-live="polite"></div>
</form>

<script>
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const result = document.getElementById('result');

    function checkPasswordRules() {
        const value = password.value;
        const username = document.getElementById('username').value.toLowerCase();
        const email = document.getElementById('email').value.toLowerCase();
        let message = '';
        if (value && !/[A-Z]/.test(value)) message = 'Add an uppercase letter.';
        else if (value && !/[a-z]/.test(value)) message = 'Add a lowercase letter.';
        else if (value && !/[0-9]/.test(value)) message = 'Add a digit.';
        else if (username && value.toLowerCase().includes(username)) message = 'Password must not contain the username.';
        else if (email && value.toLowerCase().includes(email)) message = 'Password must not contain the e-mail.';
        password.setCustomValidity(message);
        confirmPassword.setCustomValidity(
            password.value === confirmPassword.value ? '' : 'Passwords do not match.'
        );
    }

    ['password', 'confirmPassword', 'username', 'email']
        .forEach(id => document.getElementById(id).addEventListener('input', checkPasswordRules));

    // Messages are inserted with textContent only, so server data can never inject HTML.
    function showResult(kind, message, errors) {
        result.className = kind;
        result.replaceChildren();
        const p = document.createElement('p');
        p.textContent = message;
        result.appendChild(p);
        if (errors && errors.length) {
            const ul = document.createElement('ul');
            errors.forEach(e => {
                const li = document.createElement('li');
                li.textContent = e;
                ul.appendChild(li);
            });
            result.appendChild(ul);
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        checkPasswordRules();
        if (!form.reportValidity()) {
            return;
        }

        const payload = {
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: password.value
        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                body: JSON.stringify(payload)
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok) {
                form.reset();
                showResult('success', body.message || 'Account created.', []);
            } else if (response.status === 429) {
                showResult('error', 'Too many requests. Try again later.', []);
            } else {
                showResult('error', body.message || 'Registration failed.', body.errors || []);
            }
        } catch (e) {
            showResult('error', 'Cannot reach the server.', []);
        }
    });
</script>
</body>
</html>
