<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Register</title>
    <style>
        form {
            max-width: 320px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 4px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px;
        }

        small {
            display: block;
            margin-top: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
        }

        #result {
            max-width: 320px;
            margin: 16px auto;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        #result.error {
            color: #b00020;
        }

        #result.success {
            color: #1b5e20;
        }
    </style>
</head>
<body>
<form id="registerForm" novalidate>
    <h1>Register</h1>

    <div class="field">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username"
               required minlength="3" maxlength="20"
               pattern="[A-Za-z0-9]{3,20}"
               title="3-20 characters, letters and digits only."
               autocomplete="username">
        <small>3-20 characters, letters and digits only.</small>
    </div>

    <div class="field">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email"
               required maxlength="254"
               autocomplete="email">
    </div>

    <div class="field">
        <label for="password">Password *</label>
        <input type="password" id="password" name="password"
               required minlength="8" maxlength="30"
               autocomplete="new-password">
        <small>8-30 characters, at least one uppercase letter, one lowercase letter and one digit.
            Must not contain your username or e-mail.</small>
    </div>

    <div class="field">
        <label for="confirmPassword">Repeat password *</label>
        <input type="password" id="confirmPassword"
               required minlength="8" maxlength="30"
               autocomplete="new-password">
    </div>

    <div class="field">
        <div id="captcha"></div>
    </div>

    <button type="submit">Register</button>
</form>
<div id="result" role="status" aria-live="polite"></div>

<script>
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const result = document.getElementById('result');

    function checkPasswordRules() {
        const value = password.value;
        const username = document.getElementById('username').value.toLowerCase();
        const email = document.getElementById('email').value.toLowerCase();
        let message = '';
        if (value && !/[A-Z]/.test(value)) message = 'Add an uppercase letter.';
        else if (value && !/[a-z]/.test(value)) message = 'Add a lowercase letter.';
        else if (value && !/[0-9]/.test(value)) message = 'Add a digit.';
        else if (username && value.toLowerCase().includes(username)) message = 'Password must not contain the username.';
        else if (email && value.toLowerCase().includes(email)) message = 'Password must not contain the e-mail.';
        password.setCustomValidity(message);
        confirmPassword.setCustomValidity(
            password.value === confirmPassword.value ? '' : 'Passwords do not match.'
        );
    }

    ['password', 'confirmPassword', 'username', 'email']
        .forEach(id => document.getElementById(id).addEventListener('input', checkPasswordRules));

    // --- reCAPTCHA v2: site key comes from the server, widget is rendered explicitly ---
    let captchaWidgetId = null;

    async function onCaptchaApiLoaded() {
        try {
            const response = await fetch('/api/captcha/site-key', {headers: {'Accept': 'application/json'}});
            const {siteKey} = await response.json();
            captchaWidgetId = grecaptcha.render('captcha', {sitekey: siteKey});
        } catch (e) {
            showResult('error', 'CAPTCHA could not be loaded. Refresh the page.', []);
        }
    }

    function captchaResponse() {
        return captchaWidgetId === null ? '' : grecaptcha.getResponse(captchaWidgetId);
    }

    function resetCaptcha() {
        // A reCAPTCHA response is single-use, so a new one is needed after every attempt.
        if (captchaWidgetId !== null) {
            grecaptcha.reset(captchaWidgetId);
        }
    }

    // Messages are inserted with textContent only, so server data can never inject HTML.
    function showResult(kind, message, errors) {
        result.className = kind;
        result.replaceChildren();
        const p = document.createElement('p');
        p.textContent = message;
        result.appendChild(p);
        if (errors && errors.length) {
            const ul = document.createElement('ul');
            errors.forEach(e => {
                const li = document.createElement('li');
                li.textContent = e;
                ul.appendChild(li);
            });
            result.appendChild(ul);
        }
    }

    const RESEND_COOLDOWN_SECONDS = 5 * 60;   // appsec.activation.resend-cooldown-minutes
    const MAX_RESENDS = 2; // appsec.activation.max-tokens-per-user-per-day minus 1 (registration used one)

    function addResendOption(email) {
        const p = document.createElement('p');
        p.textContent = "Didn't get the e-mail? ";

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.width = 'auto';
        p.appendChild(btn);

        const info = document.createElement('p');
        info.setAttribute('role', 'status');

        let sent = 0;

        function startCooldown() {
            let left = RESEND_COOLDOWN_SECONDS;
            btn.disabled = true;
            const timer = setInterval(() => {
                left--;
                if (left <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = 'Resend the link';
                } else {
                    const m = Math.floor(left / 60);
                    const s = String(left % 60).padStart(2, '0');
                    btn.textContent = 'Resend the link (' + m + ':' + s + ')';
                }
            }, 1000);
            btn.textContent = 'Resend the link (5:00)';
        }

        btn.addEventListener('click', async () => {
            sent++;
            const limitReached = sent >= MAX_RESENDS;
            if (limitReached) {
                btn.disabled = true;
                btn.textContent = 'Resend limit reached';
            } else {
                startCooldown();
            }
            try {
                const response = await fetch('/api/auth/resend-activation', {
                    method: 'POST',
                    body: new URLSearchParams({email})
                });
                if (!response.ok) {
                    info.textContent = 'Could not resend the link. Please try again later.';
                } else if (limitReached) {
                    info.textContent = 'A new link has been sent. You have reached the limit for today. '
                        + 'If it does not arrive, check your spam folder or try again tomorrow.';
                } else {
                    info.textContent = 'A new link has been sent. Check your e-mail.';
                }
            } catch (e) {
                info.textContent = 'Cannot reach the server.';
            }
        });

        startCooldown();   // the registration e-mail just started the cooldown
        result.appendChild(p);
        result.appendChild(info);
    }
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        checkPasswordRules();
        if (!form.reportValidity()) {
            return;
        }
        const captcha = captchaResponse();
        if (!captcha) {
            showResult('error', 'Please confirm that you are not a robot.', []);
            return;
        }

        const payload = {
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: password.value,
            captchaResponse: captcha
        };
        const registeredEmail = payload.email;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                body: JSON.stringify(payload)
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok) {
                form.hidden = true;
                showResult('success', body.message || 'Account created.', []);
                addResendOption(registeredEmail);
            } else if (response.status === 429) {
                showResult('error', 'Too many requests. Try again later.', []);
            } else {
                showResult('error', body.message || 'Registration failed.', body.errors || []);
            }
        } catch (e) {
            showResult('error', 'Cannot reach the server.', []);
        } finally {
            resetCaptcha();
        }
    });
</script>
<script src="https://www.google.com/recaptcha/api.js?onload=onCaptchaApiLoaded&render=explicit" async defer></script>
</body>
</html>
