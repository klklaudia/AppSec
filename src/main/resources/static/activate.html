<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Activate account</title>
    <style>
        main {
            max-width: 320px;
            margin: 40px auto;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 8px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
<main>
    <h1>Activate your account</h1>
    <p id="msg">Activating your account...</p>
</main>

<script>
    const token = new URLSearchParams(location.search).get('token');
    const msg = document.getElementById('msg');

    async function activate() {
        if (!token) {
            msg.textContent = 'Invalid activation link.';
            return;
        }
        try {
            const response = await fetch('/api/auth/activate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token})
            });
            const body = await response.json().catch(() => ({}));
            msg.textContent = response.ok
                ? (body.message || 'Your account was activated.')
                : (body.message || 'Activation failed.');
        } catch (e) {
            msg.textContent = 'Cannot reach the server.';
            go.disabled = false;
        }
    }

    activate();
</script>
</body>
</html>
