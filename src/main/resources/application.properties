spring.application.name=Safe

server.port=8080
# Production assumption: the app runs behind HTTPS (TLS terminated here or on a reverse proxy).
# Cookies/credentials must never be sent over plain HTTP outside local development.

# --- MySQL (local development) ---
# Credentials can be overridden with env vars DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appsec_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- SMTP / MAILPIT (local) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
appsec.mail.from=no-reply@safe.local

# --- Error responses: never expose internals ---
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# --- APPSEC SECURITY PARAMETERS (values from the draft documentation) ---
# The pepper is a secret: set APPSEC_PEPPER in the environment. The fallback is for local dev only.
appsec.pepper=${APPSEC_PEPPER:dev-only-pepper-change-me-0123456789}
appsec.activation.base-url=http://localhost:8080/activate.html
appsec.activation.token-ttl-minutes=180
appsec.activation.resend-cooldown-minutes=5
appsec.activation.max-tokens-per-user-per-day=3
appsec.rate-limit.max-requests=5
appsec.rate-limit.window-minutes=15
appsec.rate-limit.block-minutes=15

# --- CAPTCHA (Google reCAPTCHA v2 checkbox) ---
# Fallbacks are Google's public TEST keys: every response passes and the widget shows a test banner.
# For a real demo create keys at https://www.google.com/recaptcha/admin (domain: localhost)
# and set RECAPTCHA_SITE_KEY / RECAPTCHA_SECRET_KEY in the environment. Never commit the secret key.
appsec.captcha.site-key=${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh4ePkwhI2Pq2O6p5WqI}
appsec.captcha.secret-key=${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
appsec.captcha.verify-url=https://www.google.com/recaptcha/api/siteverify
