spring.application.name=Safe

server.port=8080

# ---  MySQL  ---
 spring.datasource.url=jdbc:mysql://localhost:3306/appsec_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
 spring.datasource.username=root
 spring.datasource.password=

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# --- SMTP / MAILPIT (lokalnie) ---
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- PARAMETRY BEZPIECZENSTWA APLIKACJI (APPSEC) ---
appsec.pepper=zmien-ten-klucz-pepper-na-losowy-sekret-w-srodowisku
appsec.activation.base-url=http://localhost:8080/api/auth/activate
appsec.activation.token-ttl-minutes=30
appsec.activation.max-tokens-per-user-per-hour=5
appsec.rate-limit.max-requests=5
appsec.rate-limit.window-minutes=15
appsec.rate-limit.block-minutes=15