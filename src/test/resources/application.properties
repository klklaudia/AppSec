spring.application.name=Safe

# Tests run against in-memory H2 (MySQL mode), so no local MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:appsec_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.mail.host=localhost
spring.mail.port=1025
appsec.mail.from=no-reply@safe.local

appsec.pepper=test-pepper-0123456789abcdef
appsec.activation.base-url=http://localhost:8080/activate.html
appsec.activation.token-ttl-minutes=180
appsec.activation.resend-cooldown-minutes=5
appsec.activation.max-tokens-per-user-per-day=3
appsec.rate-limit.max-requests=5
appsec.rate-limit.window-minutes=15
appsec.rate-limit.block-minutes=15

# Google's public reCAPTCHA test keys; tests mock CaptchaService, so Google is never called.
appsec.captcha.site-key=6LeIxAcTAAAAAJcZVRqyHh4ePkwhI2Pq2O6p5WqI
appsec.captcha.secret-key=6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
appsec.captcha.verify-url=https://www.google.com/recaptcha/api/siteverify
